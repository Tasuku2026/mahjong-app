<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>苦手なもの確認シート</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=M+PLUS+1p:wght@400;500;700&display=swap">
<style>
/* スマホ1列の問診票:項目カード → 6段階チップ → 任意メモ。最後にLINE用テキストをコピー */
:root{
  --bg:#f2f5fb; --card:#ffffff; --fg:#1c2940; --muted:#5d6c84; --line:#d6dfec;
  --accent:#3a64c8; --accent-ink:#ffffff; --soft:#e7eefb;
  --l0:#b3261e; --l1:#d3542a; --l2:#c97a12; --l3:#9a8a1a; --l4:#4f8a3a; --l5:#2f7d6d;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --body:"M PLUS 1p","Hiragino Sans","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161f; --card:#18212e; --fg:#e5ecf6; --muted:#9aa8bd; --line:#2a3546; --accent:#86a9f2; --accent-ink:#0e1520; --soft:#1f2b3d;
  --l0:#f0857d; --l1:#f09a72; --l2:#e8b45a; --l3:#cfc069; --l4:#8cc576; --l5:#6fc3b0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161f; --card:#18212e; --fg:#e5ecf6; --muted:#9aa8bd; --line:#2a3546; --accent:#86a9f2; --accent-ink:#0e1520; --soft:#1f2b3d;
  --l0:#f0857d; --l1:#f09a72; --l2:#e8b45a; --l3:#cfc069; --l4:#8cc576; --l5:#6fc3b0; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.7;font-size:15px}
.wrap{max-width:620px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
h1{font-family:var(--display);font-size:1.55rem;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-size:1.15rem;margin:0}
p{margin:0}
.lead{color:var(--muted)}
.intro{display:grid;gap:8px}
.scale{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px;font-size:.88rem}
.scale b{font-weight:700}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
section{display:grid;gap:12px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.count{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.item-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.name{font-weight:700;font-size:1.02rem}
.name input{font:inherit;font-weight:700;border:0;border-bottom:1px dashed var(--line);background:transparent;color:var(--fg);width:100%;padding:2px 0}
.remove{font:inherit;font-size:.8rem;color:var(--muted);background:none;border:0;cursor:pointer;padding:4px}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media (min-width:520px){.chips{grid-template-columns:repeat(3,minmax(0,1fr))}}
.chip{font:inherit;font-size:.82rem;line-height:1.35;text-align:left;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;min-width:0}
.chip small{display:block;color:var(--muted);font-size:.74rem}
.chip[aria-pressed="true"]{border-color:var(--c);background:var(--c);color:var(--accent-ink)}
.chip[aria-pressed="true"] small{color:var(--accent-ink);opacity:.9}
.memo{font:inherit;font-size:.88rem;width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);color:var(--fg)}
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--card);color:var(--fg)}
button.primary,.add button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.free{width:100%;min-height:80px;font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--card);color:var(--fg)}
.send{background:var(--soft);border-radius:14px;padding:16px;display:grid;gap:10px}
#out{width:100%;min-height:140px;font:inherit;font-size:.85rem;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card);color:var(--fg)}
.status{font-size:.85rem;color:var(--accent);min-height:1.4em}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>


<div class="wrap">
  <div class="intro">
    <h1>苦手なもの確認シート</h1>
    <p class="lead">一緒に暮らすときや、お店・おでかけ先を選ぶときに気をつけたいので、どのくらい苦手かを教えてください。わかる範囲で大丈夫です。最後のボタンでコピーして、LINEで送ってもらえると嬉しいです。</p>
  </div>

  <div class="scale" aria-label="度合いの目安">
    <div><span class="dot" style="background:var(--l0)"></span><b>絶対NG</b> 命の危機がある</div>
    <div><span class="dot" style="background:var(--l1)"></span><b>NG</b> 苦しくなる</div>
    <div><span class="dot" style="background:var(--l2)"></span><b>大嫌い</b> 触れていたものもダメ</div>
    <div><span class="dot" style="background:var(--l3)"></span><b>嫌い</b> 出てきたら残す</div>
    <div><span class="dot" style="background:var(--l4)"></span><b>苦手</b> 苦手だけど大丈夫</div>
    <div><span class="dot" style="background:var(--l5)"></span><b>問題なし</b></div>
  </div>

  <section id="food">
    <div class="sec-head"><h2>食べ物・飲み物</h2><span class="count" id="food-count"></span></div>
    <div id="food-list" style="display:grid;gap:10px"></div>
    <form class="add" data-kind="food"><input id="add-food" placeholder="ほかの食べ物を追加（例: パクチー）" aria-label="食べ物を追加"><button type="submit">追加</button></form>
  </section>

  <section id="animal">
    <div class="sec-head"><h2>動物・アレルギーの環境</h2><span class="count" id="animal-count"></span></div>
    <div id="animal-list" style="display:grid;gap:10px"></div>
    <form class="add" data-kind="animal"><input id="add-animal" placeholder="ほかを追加（例: ハウスダスト）" aria-label="動物・環境を追加"><button type="submit">追加</button></form>
  </section>

  <section>
    <h2>ほかに伝えておきたいこと</h2>
    <textarea class="free" id="free" placeholder="例: 加熱すれば大丈夫なもの、薬のこと、外食で気をつけてほしいことなど"></textarea>
  </section>

  <div class="send">
    <h2>LINEで送る</h2>
    <p class="lead" style="font-size:.88rem">ボタンを押すと回答がコピーされます。そのままLINEに貼り付けて送ってください。</p>
    <button class="primary" id="copy" type="button">回答をコピー</button>
    <div class="status" id="status" role="status"></div>
    <textarea id="out" readonly aria-label="送信用テキスト"></textarea>
  </div>
</div>

<script>
const LEVELS={
  food:[["絶対NG","命の危機"],["NG","苦しくなる"],["大嫌い","触れていたものもダメ"],["嫌い","出てきたら残す"],["苦手","苦手だけど食べられる"],["問題なし",""]],
  animal:[["絶対NG","命の危機"],["NG","近くにいると苦しい"],["大嫌い","いた部屋・毛のついた物もダメ"],["嫌い","同じ部屋は避けたい"],["苦手","触らなければ大丈夫"],["問題なし",""]]
};
const COLORS=["--l0","--l1","--l2","--l3","--l4","--l5"];
const DEFAULTS={
  food:["牡蠣","エビ","カニ","イカ","チョコレート","ココア","コーヒー（カフェイン）","桃","梨","びわ","さくらんぼ"],
  animal:["犬","猫"]
};
const KEY="nigate-sheet-v1";
let state;
try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!state||!state.food){state={food:DEFAULTS.food.map(n=>({n,l:null,m:""})),animal:DEFAULTS.animal.map(n=>({n,l:null,m:"",})),free:""};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}updateOut()}

function render(kind){
  const list=document.getElementById(kind+"-list");list.innerHTML="";
  state[kind].forEach((it,i)=>{
    const card=document.createElement("div");card.className="item";
    const top=document.createElement("div");top.className="item-top";
    const nm=document.createElement("div");nm.className="name";
    if(it.custom){const inp=document.createElement("input");inp.value=it.n;inp.id=`${kind}-name-${i}`;inp.setAttribute("aria-label","項目名");inp.oninput=()=>{it.n=inp.value;save()};nm.append(inp)}else nm.textContent=it.n;
    top.append(nm);
    if(it.custom){const rm=document.createElement("button");rm.className="remove";rm.type="button";rm.textContent="削除";rm.onclick=()=>{state[kind].splice(i,1);save();render(kind)};top.append(rm)}
    const chips=document.createElement("div");chips.className="chips";chips.setAttribute("role","group");chips.setAttribute("aria-label",it.n+"の度合い");
    LEVELS[kind].forEach(([lab,sub],li)=>{
      const b=document.createElement("button");b.type="button";b.className="chip";b.style.setProperty("--c",`var(${COLORS[li]})`);
      b.setAttribute("aria-pressed",it.l===li?"true":"false");
      b.innerHTML=lab+(sub?`<small>${sub}</small>`:"");
      b.onclick=()=>{it.l=it.l===li?null:li;save();render(kind)};
      chips.append(b);
    });
    const memo=document.createElement("input");memo.className="memo";memo.id=`${kind}-memo-${i}`;memo.value=it.m||"";
    memo.placeholder=kind==="food"?"メモ（例: 加熱ならOK、エキスもダメ など）":"メモ（例: 薬を飲めば大丈夫 など）";
    memo.setAttribute("aria-label",it.n+"のメモ");memo.oninput=()=>{it.m=memo.value;save()};
    card.append(top,chips,memo);list.append(card);
  });
  const done=state[kind].filter(x=>x.l!==null).length;
  document.getElementById(kind+"-count").textContent=`${done} / ${state[kind].length} 回答済み`;
}
document.querySelectorAll("form.add").forEach(f=>f.addEventListener("submit",e=>{
  e.preventDefault();const kind=f.dataset.kind;const inp=f.querySelector("input");const v=inp.value.trim();if(!v)return;
  state[kind].push({n:v,l:null,m:"",custom:true});inp.value="";save();render(kind);
}));
const free=document.getElementById("free");free.value=state.free||"";free.oninput=()=>{state.free=free.value;save()};

function block(kind,title){
  const rows=state[kind].filter(x=>x.n.trim()).map(x=>{
    const lv=x.l===null?"未回答":LEVELS[kind][x.l][0]+(LEVELS[kind][x.l][1]?`（${LEVELS[kind][x.l][1]}）`:"");
    return `・${x.n}：${lv}${x.m?` ／ ${x.m}`:""}`});
  return `■${title}\n`+rows.join("\n");
}
function updateOut(){
  let t="【苦手なもの確認シート】\n\n"+block("food","食べ物・飲み物")+"\n\n"+block("animal","動物・アレルギーの環境");
  if(state.free.trim())t+="\n\n■ほかに伝えたいこと\n"+state.free.trim();
  document.getElementById("out").value=t;
}
document.getElementById("copy").addEventListener("click",()=>{
  const out=document.getElementById("out");const st=document.getElementById("status");
  const fallback=()=>{out.focus();out.select();st.textContent="下の文章を選択しました。長押しでコピーしてください。"};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(out.value).then(()=>{st.textContent="コピーしました。LINEに貼り付けて送ってください。"}).catch(fallback)}else fallback();
});
render("food");render("animal");updateOut();
</script>

</body>
</html>
